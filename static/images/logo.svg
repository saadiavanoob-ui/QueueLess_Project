<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <!-- Stopwatch Top Button & Ring -->
  <rect x="17" y="2" width="6" height="4" rx="2" fill="#047857" />
  <path d="M15 4H25" stroke="#047857" stroke-width="2" stroke-linecap="round" />
  
  <!-- Outer Stopwatch Circle -->
  <circle cx="20" cy="22" r="15" fill="#ECFDF5" stroke="#059669" stroke-width="3" />
  
  <!-- Dial Tick Marks -->
  <line x1="20" y1="10" x2="20" y2="12" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <line x1="31" y1="22" x2="29" y2="22" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="34" x2="20" y2="32" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <line x1="9" y1="22" x2="11" y2="22" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  
  <!-- Clock Hand showing speed / saving time -->
  <path d="M20 22L25 16" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="20" cy="22" r="2.5" fill="#047857" />
  
  <!-- Digital Queue Fast-Forward Accent -->
  <path d="M29 9L33 13" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
</svg>
