<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.3"/>
    </linearGradient>
    
    <linearGradient id="kioskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.15"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="380" cy="230" r="190" fill="url(#bgGrad)" />
  <circle cx="160" cy="140" r="90" fill="#ECFDF5" />

  <!-- Floor Plane / Base shadow -->
  <ellipse cx="310" cy="410" rx="270" ry="24" fill="#E2E8F0" opacity="0.6"/>

  <!-- ========================================== -->
  <!-- 1. WALL-MOUNTED DIGITAL QUEUE DISPLAY BOARD -->
  <!-- ========================================== -->
  <g transform="translate(180, 25)" filter="url(#softGlow)">
    <!-- Outer TV Frame -->
    <rect x="0" y="0" width="260" height="135" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Screen Inner Display -->
    <rect x="8" y="8" width="244" height="119" rx="8" fill="url(#screenGrad)"/>
    
    <!-- Top Display Header -->
    <rect x="14" y="14" width="232" height="22" rx="4" fill="#134E4A"/>
    <circle cx="26" cy="25" r="4" fill="#10B981"/>
    <text x="36" y="29" fill="#ECFDF5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">NOW SERVING</text>
    <text x="195" y="29" fill="#A7F3D0" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">COUNTER 01</text>

    <!-- Large Current Token Number -->
    <rect x="14" y="42" width="145" height="52" rx="6" fill="#022C22" stroke="#059669" stroke-width="1.5"/>
    <text x="86" y="81" text-anchor="middle" fill="#34D399" font-family="'Courier New', monospace, sans-serif" font-size="34" font-weight="900" letter-spacing="2">A-102</text>

    <!-- Queue Status Info right panel -->
    <g transform="translate(166, 42)">
      <rect x="0" y="0" width="80" height="52" rx="6" fill="#1E293B" />
      <text x="8" y="15" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="600">UP NEXT</text>
      <text x="8" y="30" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="700">A-103</text>
      <text x="8" y="45" fill="#94A3B8" font-family="monospace" font-size="10">A-104</text>
    </g>

    <!-- Bottom Ticker / Status Bar -->
    <rect x="14" y="100" width="232" height="18" rx="4" fill="#047857" opacity="0.2"/>
    <circle cx="24" cy="109" r="3" fill="#10B981"/>
    <text x="32" y="112" fill="#6EE7B7" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="500">Service: OP Doctor Consultation • Dept 1</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. SERVICE COUNTER & DESK -->
  <!-- ========================================== -->
  <g transform="translate(240, 240)">
    <!-- Modern Service Desk -->
    <path d="M 0 50 L 170 50 L 160 145 L 10 145 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Counter Top Surface -->
    <path d="M -10 45 L 180 45 L 170 55 L -5 55 Z" fill="#059669"/>
    <!-- Glass Partition on Desk -->
    <rect x="15" y="-30" width="140" height="75" rx="6" fill="#6EE7B7" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 3"/>
    
    <!-- Desk Front Accent line -->
    <rect x="25" y="70" width="120" height="8" rx="4" fill="#ECFDF5"/>
    <text x="85" y="105" text-anchor="middle" fill="#065F46" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">COUNTER 01</text>
    <text x="85" y="122" text-anchor="middle" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="9">Express Verification</text>

    <!-- Desktop Monitor on Desk -->
    <rect x="50" y="5" width="42" height="30" rx="3" fill="#1E293B"/>
    <rect x="53" y="8" width="36" height="24" rx="2" fill="#047857"/>
    <rect x="68" y="35" width="6" height="10" fill="#475569"/>
    <rect x="62" y="44" width="18" height="2" fill="#334155"/>

    <!-- Desk Staff / Officer -->
    <!-- Head -->
    <circle cx="120" cy="-5" r="14" fill="#FBCFE8"/>
    <!-- Hair -->
    <path d="M 107 -10 C 107 -24 133 -24 133 -10 C 133 -6 131 -4 129 -4 C 127 -15 113 -15 111 -4 Z" fill="#1E293B"/>
    <!-- Torso / Uniform -->
    <path d="M 103 9 C 103 5 137 5 137 9 L 142 45 L 98 45 Z" fill="#047857"/>
    <!-- ID badge -->
    <rect x="122" y="20" width="8" height="12" rx="2" fill="#FFFFFF"/>
    <line x1="126" y1="12" x2="126" y2="20" stroke="#059669" stroke-width="1"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. SMART DIGITAL TOKEN DISPENSER KIOSK -->
  <!-- ========================================== -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <!-- Kiosk Base Shadow -->
    <ellipse cx="45" cy="245" rx="35" ry="7" fill="#CBD5E1"/>

    <!-- Kiosk Body Pedestal -->
    <path d="M 22 235 L 68 235 L 62 100 L 28 100 Z" fill="#1E293B"/>
    <rect x="15" y="235" width="60" height="10" rx="4" fill="#0F172A"/>

    <!-- Kiosk Upper Head Unit -->
    <rect x="10" y="20" width="70" height="90" rx="10" fill="url(#kioskGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- Touchscreen Display -->
    <rect x="18" y="28" width="54" height="46" rx="6" fill="#022C22"/>
    <!-- Screen Header -->
    <rect x="22" y="32" width="46" height="8" rx="2" fill="#059669"/>
    <text x="45" y="38" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="5" font-weight="700">TOUCH TO BOOK</text>
    
    <!-- Screen Button -->
    <rect x="24" y="45" width="42" height="16" rx="3" fill="#10B981"/>
    <text x="45" y="55" text-anchor="middle" fill="#022C22" font-family="'Segoe UI', sans-serif" font-size="6" font-weight="800">GET TOKEN</text>

    <!-- Ticket Dispenser Slot -->
    <rect x="26" y="80" width="38" height="4" rx="2" fill="#0F172A"/>
    <!-- Token Slip coming out -->
    <rect x="33" y="84" width="24" height="22" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
    <line x1="37" y1="89" x2="53" y2="89" stroke="#059669" stroke-width="1.5"/>
    <text x="45" y="98" text-anchor="middle" fill="#0F172A" font-family="monospace" font-size="6" font-weight="700">A-105</text>
    <line x1="37" y1="102" x2="53" y2="102" stroke="#94A3B8" stroke-width="0.8"/>

    <!-- Green Status LED ring -->
    <circle cx="45" cy="14" r="3" fill="#34D399" />
  </g>

  <!-- ========================================== -->
  <!-- 4. WAITING CITIZENS / STUDENTS (CHAIRS & PEOPLE) -->
  <!-- ========================================== -->

  <!-- Waiting Chair 1 & Person 1 (Sitting, looking at phone) -->
  <g transform="translate(425, 230)">
    <!-- Waiting Bench / Chair -->
    <rect x="10" y="80" width="60" height="70" rx="8" fill="#E2E8F0"/>
    <rect x="15" y="105" width="50" height="45" rx="6" fill="#047857"/>
    <!-- Legs -->
    <line x1="20" y1="150" x2="16" y2="175" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="150" x2="64" y2="175" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

    <!-- Person 1 (Young woman relaxing, checking live token on phone) -->
    <!-- Legs sitting -->
    <path d="M 30 115 L 30 145 L 5 145 L 5 175" stroke="#1E293B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Torso -->
    <path d="M 28 65 C 28 60 52 60 52 65 L 50 115 L 26 115 Z" fill="#F59E0B"/>
    <!-- Head -->
    <circle cx="40" cy="46" r="13" fill="#FED7AA"/>
    <!-- Hair -->
    <path d="M 27 46 C 27 30 53 30 53 46 C 53 54 50 56 46 56 C 40 40 32 42 27 46 Z" fill="#78350F"/>
    
    <!-- Arm holding phone -->
    <path d="M 32 75 L 18 95 L 10 90" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Mobile Phone in hand with green checkmark -->
    <rect x="4" y="80" width="12" height="18" rx="2" fill="#0F172A"/>
    <rect x="6" y="82" width="8" height="14" rx="1" fill="#ECFDF5"/>
    <circle cx="10" cy="88" r="2.5" fill="#10B981"/>
    
    <!-- Floating mini-badge above phone: "Token: A-103 (Wait: 4m)" -->
    <g transform="translate(-40, 40)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="85" height="26" rx="13" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="14" cy="13" r="5" fill="#D1FAE5"/>
      <path d="M 12 13 L 13.5 15 L 16.5 11" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
      <text x="24" y="13" fill="#065F46" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="700">A-103</text>
      <text x="24" y="21" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="6.5">Next in 4 mins</text>
    </g>
  </g>

  <!-- Person 2 (Standing at counter or walking up) -->
  <g transform="translate(195, 230)">
    <!-- Legs -->
    <line x1="28" y1="120" x2="26" y2="175" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="38" y1="120" x2="42" y2="175" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso / Jacket -->
    <path d="M 22 68 C 22 60 48 60 48 68 L 46 122 L 20 122 Z" fill="#0284C7"/>
    <!-- Head -->
    <circle cx="34" cy="48" r="12" fill="#FDE68A"/>
    <!-- Hair -->
    <path d="M 23 48 C 23 35 45 35 45 48 Z" fill="#1E293B"/>
    <!-- Arm pointing token to counter -->
    <path d="M 40 76 L 60 76" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <!-- Paper Token Slip in hand -->
    <rect x="60" y="70" width="10" height="13" rx="1" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="65" y="79" text-anchor="middle" fill="#047857" font-family="monospace" font-size="5" font-weight="700">A-102</text>
  </g>

  <!-- ========================================== -->
  <!-- 5. FLOATING STATS / FEATURE PILLS -->
  <!-- ========================================== -->
  <!-- Left Pill: 100% Digital Queue -->
  <g transform="translate(50, 45)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="125" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="17" cy="17" r="10" fill="#ECFDF5"/>
    <path d="M 12 17 L 16 21 L 22 13" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="16" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700">No Physical Crowds</text>
    <text x="34" y="26" fill="#10B981" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="600">Zero Standing In Line</text>
  </g>

  <!-- Right Bottom Pill: Live Wait Time Tracking -->
  <g transform="translate(420, 115)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="20" cy="19" r="12" fill="#D1FAE5"/>
    <!-- Stopwatch Mini Icon -->
    <circle cx="20" cy="19" r="7" stroke="#047857" stroke-width="1.5" fill="none"/>
    <line x1="20" y1="15" x2="20" y2="19" stroke="#047857" stroke-width="1.5"/>
    <line x1="20" y1="19" x2="23" y2="19" stroke="#047857" stroke-width="1.5"/>
    <text x="38" y="17" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700">Save ~45 Mins Average</text>
    <text x="38" y="28" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="8">Real-time status updates</text>
  </g>

  <!-- Decorative Sparkles / Floating Dots -->
  <circle cx="530" cy="80" r="4" fill="#34D399" opacity="0.6"/>
  <circle cx="140" cy="70" r="3" fill="#10B981" opacity="0.5"/>
  <circle cx="480" cy="380" r="5" fill="#A7F3D0" opacity="0.7"/>
  <circle cx="100" cy="380" r="4" fill="#34D399" opacity="0.4"/>
</svg>
