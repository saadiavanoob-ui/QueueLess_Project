{% extends 'base.html' %}

{% block title %}Admin Counter Login - QueueLess{% endblock %}

{% block content %}
<section style="padding: 70px 0 90px; background: linear-gradient(180deg, #f0fdf4 0%, var(--light-grey) 100%);">
  <div class="container">
    <div style="max-width: 440px; margin: 0 auto;">
      
      <!-- Login Card -->
      <div class="form-card" style="box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 26px;">
          <div style="width: 60px; height: 60px; border-radius: 16px; background-color: var(--mint-bg); color: var(--emerald-green); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 14px;">
            <i class="fa-solid fa-lock"></i>
          </div>
          <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--dark-green);">Counter Staff Login</h2>
          <p style="font-size: 0.9rem; color: var(--text-muted);">
            Access queue caller & token administration
          </p>
        </div>

        {% if error %}
        <div style="background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 20px;">
          <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="admin" value="admin" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" value="admin123" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
            <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
          </button>
        </form>

        <!-- College Exhibition Demo Credentials Pill -->
        <div style="margin-top: 24px; padding: 14px; background-color: var(--mint-bg); border-radius: 10px; border: 1px solid var(--mint-border); text-align: center;">
          <small style="color: var(--dark-green); font-weight: 700; display: block; margin-bottom: 4px;">
            🎓 College Exhibition Demo Access:
          </small>
          <code style="background: #ffffff; padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; color: var(--emerald-green); font-weight: 700;">
            admin / admin123
          </code>
        </div>
      </div>

    </div>
  </div>
</section>
{% endblock %}
